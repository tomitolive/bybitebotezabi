name: Run Trading Bot

on:
  schedule:
    - cron: '0 * * * *' # يشتغل كل ساعة أوتوماتيكياً
  workflow_dispatch: # يتيح لك تشغيله يدوياً من زر في غيتهاب

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run bot script
        env:
          BYBIT_API_KEY: ${{ secrets.BYBIT_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python bot.py

      - name: Commit and push status changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add status.json
          git commit -m "Update bot status [skip ci]" || exit 0
          git push
          
